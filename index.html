<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Thiết lập cho phần Danh sách Sản phẩm */
      .product-section {
        margin: 40px auto;
        max-width: 900px;
        text-align: center;
      }

      .section-title {
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .product-grid {
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }

      .product-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 30%;
        transition: 0.3s;
      }

      .product-card:hover {
        transform: translateY(-5px); /* Hiệu ứng nảy lên khi di chuột */
      }

      .price {
        color: #e74c3c;
        font-weight: bold;
        font-size: 18px;
      }

      .btn-buy {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
      }

      .btn-buy:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <!-- Phần Danh sách Sản phẩm -->
    <div class="product-section">
      <h2 class="section-title">Sản phẩm nổi bật</h2>
      <div class="product-grid">
        <div class="product-card">
          <h3>Áo Hoodie Nam</h3>
          <p class="price">250.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
        <div class="product-card">
          <h3>Quần Jean Nữ</h3>
          <p class="price">300.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
        <div class="product-card">
          <h3>Giày Sneaker</h3>
          <p class="price">500.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
        <div class="product-card">
          <h3>Sịp Spider Man</h3>
          <p class="price">1.000.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e0e5ec; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .profile-card { 
            background: white; 
            width: 400px; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .profile-avatar { 
            width: 120px; 
            height: 120px; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 50px; 
            margin: 0 auto 20px; 
            box-shadow: 0 8px 15px rgba(9, 132, 227, 0.3);
        }
        .profile-name { 
            font-size: 26px; 
            color: #2d3436;
            font-weight: 800; 
            margin-bottom: 10px; 
        }
        .profile-role { 
            color: #636e72; 
            font-size: 15px;
            margin-bottom: 25px; 
            line-height: 1.5;
        }
        .profile-skills { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
        }
        .skill-tag { 
            background: #f1f2f6; 
            color: #2f3542; 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: bold; 
        }
        .btn-contact { 
            background: #00cec9; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
            width: 100%;
        }
        .btn-contact:hover { 
            background: #00b894; 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-avatar">👨‍💻</div>
        <div class="profile-name">Trịnh Quốc Trung</div>
        <div class="profile-role">Sinh viên CNTT<br>Học viện Công nghệ Bưu chính Viễn thông (PTIT)</div>
        
        <div class="profile-skills">
            <span class="skill-tag">Python (FastAPI)</span>
            <span class="skill-tag">HTML/CSS</span>
            <span class="skill-tag">MySQL</span>
            <span class="skill-tag">Git</span>
        </div>

        <button class="btn-contact" onclick="alert('Đã gửi yêu cầu kết nối thành công!')">Kết Nối Với Tôi</button>
    </div>

</body>
</html>
